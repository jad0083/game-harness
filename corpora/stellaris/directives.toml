# Governor directives (strategy.md § 9), applied from the in-game console by
# `game-controller stellaris directive <name>` / MCP `stellaris_directive`, with the game paused:
#
#   effect remove_country_flag = governor_directive_<other> …
#   effect set_country_flag|remove_country_flag = governor_posture_<p> …          (postures, below)
#   effect if = { limit = { can_set_policy = { policy = <p> option = <o> } <conditions.p> }
#                 set_policy = { policy = <p> option = <o> cooldown = yes }
#                 log = "GOVERNOR_POLICY <p> <o> <nonce>" }                       (one line per policy)
#   effect set_country_flag = governor_directive_<name>
#          if = { limit = { exists = capital_scope } log = "GOVERNOR_APPLIED <name> <nonce>" }
#
# The game's AI plays the empire under `human_ai` (see `stellaris take-control`); the player stays
# in control, so the console's scope is the empire. The confirmation is logged only with a real
# country scope (it fails loudly in observer mode) and carries a nonce, because game.log drops text
# repeated on the same in-game day. The next autosave also shows the flag.
#
# Only policy options that exist in the game's common/policies (4.5.1, read 2026-09-25) are used.
# Each policy is set only under its option's `valid` trigger (`conditions`, copied from
# common/policies 4.5.1), because a console set_policy would not check it.
# A directive never adds resources or modifiers, and it sets policies only as a player could:
# `can_set_policy` checks the 10-year lock, the group's `allow` (no diplomatic stance or war
# philosophy change at war) and the option's `potential` (economic policy is not for gestalts), and
# `cooldown = yes` starts the player's 10-year lock. Policies are therefore a slow lever, held 10
# years once set; the flags (and the mod's budgets that read them) are the fast lever. A policy the
# game did not set is reported as locked (no GOVERNOR_POLICY marker), not as a failure. An option
# the newest autosave already holds is not sent (setting it again could restart its lock), and is
# reported as already in force.
#
# Postures (levers design rulings 18-21): country flags governor_posture_<name> beside the directive,
# read by the Governor Bridge mod v2 (corpora/stellaris/mod) to steer how the game's AI spends its
# own income: economic-plan focus and AI budget entries, never resources or modifiers. A directive
# lists the postures it switches (`postures`); applying it sets those that are enabled and clears
# every other posture bound to a directive. `war_crisis` is bound to no directive: only the war
# crisis sets or clears it (`stellaris posture` / MCP `stellaris_posture`). Every posture stays
# `enabled = false` until its live probe passes (fork-and-reload A/B from one autosave, 24 in-game
# months per arm); enabling one is a data commit, with no mod change.

[directive.expand]
description = "Grow: outposts, colonies, exploration. Pick in the opening or while unclaimed habitable systems are near and no deficits."
# proactive first contact: +50% influence from each completed first contact (localisation
# first_contact_proactive_effects, 4.5.1); influence gates outposts
policies = { diplomatic_stance = "diplo_stance_expansionist", first_contact_protocol = "first_contact_proactive" }
conditions = { diplomatic_stance = "is_homicidal = no", first_contact_protocol = "is_homicidal = no is_xenophobe = no NOT = { has_origin = origin_payback }" }

[directive.consolidate_economy]
description = "Fix deficits, housing, amenities and stability before anything else."
policies = { economic_policy = "economic_policy_balanced" }

[directive.tech_rush]
description = "Research first while borders are safe and the economy is stable."
policies = { economic_policy = "economic_policy_civilian" }
postures = ["research_focus"]

[directive.prepare_war]
description = "Alloys, naval capacity, claims. Only against a weaker neighbour, after ask_human."
# belligerent: +10% naval capacity, -10% war exhaustion, -10% claim cost (common/policies 4.5.1)
policies = { economic_policy = "economic_policy_military", diplomatic_stance = "diplo_stance_belligerent" }
postures = ["naval_cap", "ship_upgrades"]
conditions = { diplomatic_stance = "NOT = { has_valid_civic = civic_inwards_perfection } is_homicidal = no" }

[directive.defend]
description = "War on us or a stronger hostile neighbour on the border: fleets home, fortify chokepoints."
# belligerent: +10% naval capacity and -10% war exhaustion while we fight; the next peacetime
# directive (expand / diplomacy_first) sets its own stance again
policies = { diplomatic_stance = "diplo_stance_belligerent" }
postures = ["naval_cap", "ship_upgrades"]
conditions = { diplomatic_stance = "NOT = { has_valid_civic = civic_inwards_perfection } is_homicidal = no" }

[directive.diplomacy_first]
description = "Improve relations, pacts, federation and galactic community standing."
policies = { diplomatic_stance = "diplo_stance_cooperative", first_contact_protocol = "first_contact_proactive" }
conditions = { diplomatic_stance = "NOT = { has_valid_civic = civic_inwards_perfection } is_unfriendly = no", first_contact_protocol = "is_homicidal = no is_xenophobe = no NOT = { has_origin = origin_payback }" }

# ---- postures (Governor Bridge v2) -------------------------------------------------------------

[posture.naval_cap]
description = "Economic-plan subplan in all six plans: build toward naval capacity 250 with an alloys focus (construction priority, never holds a plan open)."
mod_version = 2
enabled = false

[posture.research_focus]
description = "Economic-plan subplan in all six plans: research focus on physics, society and engineering (construction priority for labs and research jobs)."
mod_version = 2
enabled = false

[posture.ship_upgrades]
description = "AI budget: alloys to ship upgrades while the fleet is at 95% of naval capacity or more, also at war (vanilla funds upgrades only at peace)."
mod_version = 2
enabled = false

[posture.war_crisis]
description = "AI budget while a war goes badly: minerals to defence armies, and alloys to starbases (defence platforms) at 95% of naval capacity or more. Set and cleared by the war crisis only."
mod_version = 2
enabled = false
