# Stellaris - Machine Executable Game Manifest
# Used by the native Rust game-controller for hotkey lookups, screen signatures and macros.
#
# Provenance: "# verified" = confirmed on the user's PC; "# wiki: <page>" = stated by the official
# wiki (stellaris.paradoxwikis.com, see docs/); everything else is "# unverified".
# Stellaris hotkeys are not rebindable in-game (wiki: Hotkeys).

[metadata]
id = "stellaris"
name = "Stellaris"
version = "4.5.1"   # verified 2026-09-25: main menu shows "Cygnus v4.5.1 (358e)" (Steam)
process_title = "Stellaris"   # verified 2026-09-25: agent /windows lists the game window as "Stellaris"
native_resolution = [3840, 2160]   # the PC's desktop; the game runs borderless (verified 2026-09-25)
downscaled_resolution = [1568, 882]

[hotkeys]
# --- Time ---
pause = "space"                 # wiki: Hotkeys — "Pause / Unpause"
speed_up = "="                  # verified 2026-09-25: steps Normal → Fast → Fastest (US =/+ key, VK_OEM_PLUS)
speed_down = "-"                # verified 2026-09-25: steps down to Slowest. Speeds: Slowest, Slow, Normal, Fast, Fastest
# Numpad +/- also work per the wiki, but the agent's key table (crates/game-agent/src/keys.rs)
# has no numpad names yet.

# --- Console ---
# wiki: Console commands — "Shift+2, ALT+2+1, Shift+3, §, ~, ^, °, ² or ` (key varies based on
# keyboard layout). For a QWERTY keyboard, the key is `. Else, try Shift+Alt+C."
# Console is unavailable in ironman games; using it disables achievements.
console = "`"                   # verified 2026-09-25: opens/closes the console on the user's PC (agent key "`" = VK_OEM_3)
console_fallback = "shift+alt+c"  # unverified

# --- Main screens (function keys) ---
# wiki: Hotkeys — F1..F10 open "Navigation menu item 1..10"; the player can rearrange the menu,
# so what each key opens depends on the menu order. The screen names below are the commonly
# listed default order (third-party lists; the wiki's own sub-headings disagree for F2/F3:
# "Situation Log Menu - F2", "Market Menu - F3"). All unverified: read the navigation bar live.
nav_1 = "f1"     # unverified: Government
nav_2 = "f2"     # unverified: Contacts (or Situation Log per the wiki sub-heading)
nav_3 = "f3"     # unverified: Situation Log (or Market per the wiki sub-heading)
nav_4 = "f4"     # unverified: Technology
nav_5 = "f5"     # unverified: Planets and Sectors
nav_6 = "f6"     # unverified: Policies and Edicts
nav_7 = "f7"     # unverified: Factions
nav_8 = "f8"     # unverified: Traditions and Ascension Perks
nav_9 = "f9"     # unverified: Expansion Planner
nav_10 = "f10"   # unverified: Ship Designer
# Tabs inside a window (wiki: Hotkeys): Z / X / C / V select the 1st..4th tab, e.g. Technology:
# Z Physics, X Society, C Engineering, V Researched; Government: Z Government, C Demographics.
tab_1 = "z"
tab_2 = "x"
tab_3 = "c"
tab_4 = "v"
screenshot = "f11"               # wiki: Hotkeys — PNG into Documents/Paradox Interactive/Stellaris/screenshots
hide_ui = "ctrl+f9"              # wiki: Hotkeys

# --- Selection & map ---
close_window = "esc"            # wiki: Hotkeys — "Close active menu / Open main menu"
home = "home"                   # wiki: Hotkeys — "Go to home system" (also backspace)
outliner = "o"                  # wiki: Hotkeys — "Outliner Open/Close"
galaxy_map = "m"                # wiki: Hotkeys — "Open/Close Galaxy Map" (listed as E M)
system_search = "f"             # verified 2026-09-25: opens "Search known star systems"; while it has focus, Space types instead of pausing (Esc closes it)
next_system = "tab"             # wiki: Hotkeys — cycles through your star systems
focus_selected = "q"            # wiki: Hotkeys — camera focus / go to selected
reset_camera = "r"              # wiki: Hotkeys
pan_up = "w"                    # wiki: Hotkeys (W A S D)
pan_left = "a"
pan_down = "s"
pan_right = "d"
# Fleet window (wiki: Hotkeys): G merge, H stop, B return, C move, J jump, P patrol,
# X attack target, T stance, V split, Delete disband. Not bound here: the governor model leaves
# fleet orders to the native AI.

# Screens (template procedure: AGENTS.md §5).

[screens.paused]
description = "Large yellow 'Paused' label above the selected-system banner (bottom centre); shown only while paused. The label pulses in brightness, so the colour signature decides (verified 2026-09-25: 23-47% yellow pixels paused, 0% running; the template alone scored 0.011-0.108 paused vs 0.20 running)."
template = "templates/stellaris_paused.png"
template_roi = [0.477, 0.9456, 0.0459, 0.0215]
template_threshold = 0.06
template_search = 3
color_range = [[150, 120, 0], [255, 255, 110]]
color_min_fraction = 0.08

# The console's reply to `human_ai` ("Human AI is now ON" / "... OFF"), read on the bottom output
# line after `help` has filled the console. The two words are told apart by which template is
# closer (verified 2026-09-25: 0.048 apart; each matches itself at ~0.01).
[screens.human_ai_on]
description = "Console reply 'Human AI is now ON' (last output line, after `help`)"
template = "templates/stellaris_human_ai_on.png"
template_roi = [0.0446, 0.2222, 0.014, 0.0136]
template_search = 2

[screens.human_ai_off]
description = "Console reply 'Human AI is now OFF' (last output line, after `help`)"
template = "templates/stellaris_human_ai_off.png"
template_roi = [0.0446, 0.2222, 0.014, 0.0136]
template_search = 2

