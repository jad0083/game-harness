# Stellaris strategy pillars: what the Strategist may write and how it is checked, which directive
# each pillar ranks, which metrics milestones may use, and the limits of the two player actions.
# Loaded by src/pilot/pillars.py (docs/design/2026-09-26-game-pillars-design.md).
# Unknown keys are an error; directives must exist in directives.toml. Pillar order = display
# fallback; weights come from the Strategist.

[strategy]
# detail a Strategist's answer must have (pinned pillars and human edits are exempt)
min_milestones_each = 1         # every pillar is measurable
min_milestones_first = 2        # the heaviest pillar: a checkpoint and an end target, on different dates
min_goals = 2                   # ... for each of the top 3 pillars
min_goals_top = 3
stance_needs_figure = true      # each stance quotes a number from the briefing
# spellings models use for the recorded measures (seen live: "rank:military" on 2452.03)
metric_aliases = { military = "military_power", economy = "economy_power", tech = "tech_power", planets = "colonies", techs = "techs_known", "rank:military" = "rank:military_power", "rank:economy" = "rank:economy_power", "rank:tech" = "rank:tech_power", "rank:planets" = "rank:colonies" }
instructions = """Everything must be achievable through directives, tech picks or market orders: the game's AI builds, designs ships and moves fleets.
While at war, the defence stance must name its exit condition (peace, war exhaustion, or planets retaken). When a hostile neighbour's military is twice ours or more, a defence goal is two shipyards in different systems and alloy production on two or more planets; never reason from a naval-capacity cap the briefing does not show."""

# The shared code's time constants, in months here (docs/design/2026-09-27-postmortem-fixes-design.md,
# rulings 15 and 19).
[time]
unit = "months"
review_cap = 12                 # event reviews: at most one per 12 months...
review_exempt = ["new war"]     # ...but a new war always reviews (a colony lost at war enters the war crisis)
milestone_lookback = 12         # a milestone's projection: its value against a row 12 months older
score_horizon = 12              # outcome scoring: the metrics 12 months after a decision
buildup_window = 24             # neighbour buildup: 2 x ours and +50% within 24 months, urgent only (ruling 11)

[weights]
# Pillars carry weights (sum 100) instead of ranks; each decision scores a directive by its pillar's
# pressure = weight x need, need from the pillar's milestones (the largest multiplier among them;
# 1.0 without milestones). A met pillar lets go, an at-risk or missed one pushes.
mode = "exclusive"      # one standing directive at a time
min = 5                 # every pillar counts
max = 50                # none dominates
spread = 2              # heaviest >= 2 x lightest (no even spread)
switch_margin = 1.25    # keep the current directive while its pressure >= top / 1.25
need = { met = 0.3, on_track = 1.0, at_risk = 1.5, missed = 2.0 }
# A directive held 2+ years in this campaign whose pillar's milestone metric grew no faster than while
# it was not held "does not work here": its pressure is halved (e.g. tech_rush with Slow Learners).
stall_years = 2.0
stall_factor = 0.5

[orders]
# The action record (docs/design/2026-09-27-stellaris-levers-design.md, rulings 2-6): every directive,
# tech pick, market order and posture is followed in the autosaves until it resolves, and the stick
# rate per key goes to the decision prompt, the Strategist and the dashboard. The "turns" keys are
# in-game months here (directive switches came one per 3.4-7.6 years).
window_turns = 120              # actions resolved in the last 10 in-game years...
min_resolved = 6                # ...widened back until 6 of the key are judged, or to the campaign start
min_samples = { other = 3 }     # every Stellaris key is in the `other` group; below this: counts only
weak_rate = 0.5                 # at or below: "does not stick here"
open_cap_turns = 24             # an action is followed 24 months at most (then held)
open_grace_turns = 1            # first judged on a save at least 1 month after it was sent

[metrics]
# the briefing's recorded measures; rank:<measure> is our standing among the empires, 1 = best
names = ["systems", "colonies", "pops", "techs_known", "military_power", "economy_power", "tech_power",
         "rank:systems", "rank:pops", "rank:techs", "rank:military_power", "rank:economy_power",
         "rank:tech_power", "rank:colonies"]
row_keys = { colonies = "planets" }   # metrics rows store colonies as `planets`
# where a row keeps the metric's median over the other empires (`peers`; default: the metric's name):
# a directive's efficacy is then the yearly change of ours / median, not of ours (levers ruling 7)
peer_keys = { techs_known = "techs" }

[pillars.economy]
label = "Economy"
description = "Income, deficits, stockpiles and the market."
directive = "consolidate_economy"
actions = ["market"]

[pillars.expansion]
label = "Expansion"
description = "Outposts, colonies, systems and exploration."
directive = "expand"

[pillars.technology]
label = "Technology"
description = "Research speed and which techs to take."
directive = "tech_rush"
actions = ["tech"]

[pillars.diplomacy]
label = "Diplomacy"
description = "Relations, pacts, federations and the galactic community."
directive = "diplomacy_first"

[pillars.defence]
label = "Defence"
description = "Fleets, starbases, wars and chokepoints."
directive = "defend"

[pillars.government]
label = "Government"
description = "Policies, civics, factions and stability."

[pillars.society]
label = "Society"
description = "Pops, species, amenities and happiness."

# At most one order until ui.market.order_row_pitch is measured live: the controller can only
# find (and so remove) the first order row. Amounts equal mcp.rs MARKET_AMOUNT_MIN/MAX.
[actions.market]
max_items = 1
resources_from_manifest = "ui.market.resources"
amount_min = 1
amount_max = 25
sell_income_share = 0.2        # a sell takes at most 20% of that resource's monthly income
sell_requires_idle = true      # sell only a resource the briefing flags IDLE
note = "Market orders cannot use trade; sell only idle energy, minerals, food or consumer goods (strategic resources can only be bought); alloys and sr_* orders are not placed until their start amount is measured. Buys pass the buy rules at every sync: 2,500 trade kept, at most a quarter of the trade income plus the surplus over two years, no new order above +50% price (none kept above +100%), never a resource the AI buys itself (under 6 months of cover, or it bought some since the last save), an IDLE one, or alloys with the fleet at 95% of naval capacity. While trade is IDLE and no order of yours passes, the harness fills the slot with deficit cover (a resource with 6-24 months of stock left)."

# Buy rules (docs/design/2026-09-27-stellaris-levers-design.md, ruling 9), checked at every sync for the
# declared buys and the automatic ones. Price per unit = 100 / base_amount x (1 + fluctuation) x (1 + fee);
# a buy is allowed only if trade - 12 x max(0, cost - trade income) >= trade_reserve (where the AI's own
# market spending starts), and its cost is at most income_share x trade income + (trade - trade_reserve)
# / surplus_months. `volume` caps a monthly trade in base amounts (price decay and impact per base amount
# are inferred, unverified: live check L1).
[actions.market.buy]
base_amount = { energy = 100, minerals = 100, food = 100, consumer_goods = 50, alloys = 25, volatile_motes = 10, exotic_gases = 10, rare_crystals = 10, sr_living_metal = 5, sr_zro = 5, sr_dark_matter = 5 }   # market_amount, common/strategic_resources 4.5.1
fee = 0.3
trade_reserve = 2500
income_share = 0.25
crisis_income_share = 0.5      # alloys in a war crisis
surplus_months = 24
skip_above_pct = 50            # no new order while the price is over +50%...
never_above_pct = 100          # ...and an order in place is dropped over +100%
volume = { internal = 1, galactic = 6 }
ai_cover_months = 6            # AI_MARKET_BUY_MONTHS_OF_COVER: under it the AI buys by itself
cover_months = 24              # deficit cover: 6..24 months of stock left...
strategic_cover_months = 36    # ...36 for motes, gases and crystals
strategic = ["volatile_motes", "exotic_gases", "rare_crystals"]
naval_full = 0.95              # no alloys at 95% of naval capacity (outside a war crisis)
cover_factor = 1.2             # deficit cover buys 1.2 x the monthly deficit
idle_fill = true

# Equals mcp.rs stellaris_pick_tech's limit on `prefer`.
[actions.tech]
field = "prefer_techs"
max_items = 6
ids_from_corpus = "tech"       # data/tech.json
