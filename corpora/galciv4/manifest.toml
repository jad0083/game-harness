# Galactic Civilizations IV: Supernova - Machine Executable Game Manifest
# Used by native Rust game-controller for zero-latency lookups and autonomous macros.

[metadata]
id = "galciv4"
name = "Galactic Civilizations IV: Supernova"
version = "4.1.1"
process_title = "Galactic Civilizations"
native_resolution = [3840, 2160]
downscaled_resolution = [1568, 882]

[hotkeys]
# Provenance: "verified" = confirmed in play (see PLAYING.md); everything else is unverified.
# Turn & Global Navigation
next_action = "tab"   # verified: selects the next pending item (idle ship, empty queue, policy slot)
end_turn = "tab"      # verified: turn button "Press Tab to advance to next turn" when nothing is pending
cancel = "esc"        # verified: closes an open panel; on the bare map it OPENS the pause menu
confirm_yes = "y"
confirm_no = "n"
homeworld = "h"
center_selection = "c"
toggle_grid = "g"
toggle_chat = "t"
console = "`"

# Ship & Unit Commands (hotkeys shown in each action button's tooltip)
standby = "j"         # verified: "Standby — remain here, skipping its turns"
explore = "o"         # verified: "Explore — will attempt to clear the fog of war" (probes, survey ships)
auto_colonize = "c"   # verified: colony ship "Auto Colonize"
upgrade_ship = "u"
rush_buy = "r"
decommission = "delete"

# Camera Controls
zoom_in = "z"
zoom_out = "x"
pan_up = "w"
pan_left = "a"
pan_down = "s"
pan_right = "d"
pivot_cw = "e"
pivot_ccw = "q"

# Dialog & Choice Hotkeys (Verified 100% deterministic)
option_1 = "1"
option_2 = "2"
option_3 = "3"
option_4 = "4"

# Sub-menu Navigation
next_planet = "right"
prev_planet = "left"
next_idle_planet = "shift+right"
prev_idle_planet = "shift+left"

[screens.event_modal]
description = "Strategic event or planet colonization choice dialog"
# Mean luminance of the top resource bar, in 1568x882 frame pixels; the HUD dims behind modals
luminance_roi = [0, 0, 1568, 40]
luminance_threshold = 22.0
is_blocking = true
choice_keys = ["1", "2", "3"]

[screens.planet_management_tutorial]
description = "Planet management tutorial / viewscreen"
title_ocr = "Planet Management"
# Normalized coordinates relative to image width/height (works across all DPI scales)
buttons.done = { norm_x = 0.88, norm_y = 0.855, action = "click" }
dismiss_key = "esc"

[screens.shipyard]
description = "Orbital Shipyard production queue"
buttons.build_ship = { norm_x = 0.89, norm_y = 0.92, action = "click" }
buttons.close = { norm_x = 0.95, norm_y = 0.05, action = "click" }
dismiss_key = "esc"

[screens.research]
description = "Technology research selection screen"
buttons.select_tech = { norm_x = 0.50, norm_y = 0.50, action = "click" }
dismiss_key = "esc"

[screens.data_bank]
description = "Data Bank overview screen (Civilization, Timeline, Graphs, Report, Stats, Core Worlds)"
buttons.civilization = { norm_x = 0.205, norm_y = 0.168, action = "click" }
buttons.timeline = { norm_x = 0.345, norm_y = 0.168, action = "click" }
buttons.graphs = { norm_x = 0.485, norm_y = 0.168, action = "click" }
buttons.report = { norm_x = 0.625, norm_y = 0.168, action = "click" }
buttons.stats = { norm_x = 0.755, norm_y = 0.168, action = "click" }
buttons.core_worlds = { norm_x = 0.895, norm_y = 0.168, action = "click" }
dismiss_key = "esc"

[screens.planet_report]
description = "Planet report and colonization site selection modal"
title_ocr = "Planet Report"
is_blocking = true
choice_keys = ["1", "2", "3"]
buttons.option_1 = { norm_x = 0.245, norm_y = 0.810, action = "click" }
buttons.option_2 = { norm_x = 0.245, norm_y = 0.880, action = "click" }
buttons.option_3 = { norm_x = 0.245, norm_y = 0.950, action = "click" }

[screens.main_galaxy_map]
description = "Main Galaxy Map HUD view"
# Date readout ("Jan 13, 2329") top-right; changes every turn. Normalized to frame size.
turn_indicator_roi = [0.948, 0.004, 0.05, 0.028]
buttons.end_turn = { norm_x = 0.950, norm_y = 0.950, action = "click" }
buttons.advisors = { norm_x = 0.950, norm_y = 0.050, action = "click" }
buttons.research_panel = { norm_x = 0.080, norm_y = 0.020, action = "click" }
buttons.policies_panel = { norm_x = 0.120, norm_y = 0.080, action = "click" }

[screens.colonial_charter]
description = "Colonial Charter policy & government management screen"
buttons.government_tab = { norm_x = 0.125, norm_y = 0.168, action = "click" }
buttons.leaders_tab = { norm_x = 0.270, norm_y = 0.168, action = "click" }
buttons.ministers_tab = { norm_x = 0.410, norm_y = 0.168, action = "click" }
buttons.diplomats_tab = { norm_x = 0.555, norm_y = 0.168, action = "click" }
buttons.governors_tab = { norm_x = 0.695, norm_y = 0.168, action = "click" }
buttons.commanders_tab = { norm_x = 0.835, norm_y = 0.168, action = "click" }
buttons.parties_tab = { norm_x = 0.970, norm_y = 0.168, action = "click" }
buttons.tax_rate_low = { norm_x = 0.120, norm_y = 0.295, action = "click" }
buttons.tax_rate_med = { norm_x = 0.150, norm_y = 0.295, action = "click" }
buttons.policy_slot_1 = { norm_x = 0.395, norm_y = 0.448, action = "click" }
dismiss_key = "esc"



[macros.turn_pump]
# TAB ends the turn when nothing is pending; otherwise it opens the next "action required"
# screen and the autopilot reports NotAdvanced with that screen for the model to resolve.
# space/f (skip/sleep unit) were removed: unverified, and they would fire into the next turn.
description = "End the turn (TAB), or open the next pending action if something blocks it"
actions = [
    { type = "key", key = "tab" },
]
settle_timeout = 8.0
settle_threshold = 0.02

[macros.dismiss_tutorial]
description = "Fast-dismiss tutorial popups via Enter/Done/Esc"
actions = [
    { type = "key", key = "enter" },
    { type = "wait", ms = 100 },
    { type = "key", key = "esc" },
]

[macros.auto_scout_cycle]
description = "Select the next idle ship and order it to explore (for probes and survey ships)"
actions = [
    { type = "key", key = "tab" },
    { type = "wait", ms = 300 },
    { type = "key", key = "o" },
]

# Known informational screens: matched by template, closed by the autopilot on its own.
[screens.gnn_news]
description = "Galactic News Network bulletin (rankings, headlines); informational, one Close button"
template = "templates/gnn_live.png"          # the "GNN LIVE" logo, bottom-left of the bulletin
template_roi = [0.1913, 0.7211, 0.1122, 0.1406]
auto_dismiss = true
dismiss_click = [0.7526, 0.8707]              # Close button

[screens.idle_colony_ship]
description = "An idle colony ship is selected (TAB selects idle fleets): order Auto Colonize"
template = "templates/action_colonize.png"   # green colonize icon in the unit's first action slot
template_roi = [0.2577, 0.8265, 0.0217, 0.0385]
template_threshold = 0.06
auto_dismiss = true
dismiss_key = "c"

[screens.colonize_confirm]
description = "'Colonize Planet? <name> No/Yes' confirmation after Auto Colonize arrives: accept"
template = "templates/colonize_planet_title.png"   # dialog title "Colonize Planet"
template_roi = [0.4401, 0.3379, 0.1212, 0.0295]
template_threshold = 0.06
auto_dismiss = true
dismiss_click = [0.5708, 0.5952]                    # Yes

[screens.turn_processing]
description = "'Starting New Month' label bottom-right while AI turns run (pulses; can last minutes)"
template = "templates/starting_new_month.png"
template_roi = [0.8048, 0.9637, 0.1084, 0.0249]
template_threshold = 0.05   # measured: label present 0.007-0.011, absent >= 0.134
busy = true
