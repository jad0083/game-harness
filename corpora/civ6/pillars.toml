# Civilization VI strategy pillars (docs/design/2026-09-26-civ6-governor-design.md, ruling 5).
# Loaded by src/pilot/pillars.py. Share mode: many levers act at once (research, civics, policies,
# production, purchases), so the frame shows each pillar's share of effort instead of ranking one
# directive; no pillar ranks a directive (there is no directives.toml for this game).
# The game's AI plays through AutoplayManager; decisions give structured orders between stretches.

[strategy]
min_milestones_each = 1         # every pillar is measurable
min_milestones_first = 2        # the heaviest pillar: a checkpoint and an end target, on different turns
min_goals = 2                   # ... for each of the top 3 pillars
min_goals_top = 3
stance_needs_figure = true      # each stance quotes a number from the snapshot
date_format = "turns"           # milestone dates are turns: T60
identity = "Build on our civilization and leader: fill `identity` with how their abilities and unique units, buildings and districts (the snapshot names the civ and leader; `consult` has their records) shape this strategy and which pillars each one affects, and weigh a neighbour's agenda when dealing with or fighting it."
# Military targets relative to the majors we have met (docs/design/2026-09-27-postmortem-fixes-design.md,
# ruling 18): targets set 10-28% above our own strength stood at 0.44-0.56 of the median on their dates.
relative_military = { pillar = "military", metric = "military", relative = ["military_vs_median", "military_vs_strongest"], min_target = 0.5, absolute_share = 0.5, rank_min_peers = 3 }
# Goals no order can pursue (docs/design/2026-09-27-postmortem-fixes-design.md, ruling 25): "Get peace with
# Australia" was the goal at T563, T565 and T575; the game's AI handles diplomacy during autoplay.
unpursuable = ["peace", "ceasefire", "alliance", "friendship", "denounce"]
metric_aliases = { population = "pop", techs = "techs_known", civics = "civics_known", military_strength = "military", faith_per_turn = "faith_yield", gold_per_turn = "gold_yield", treasury = "gold", "rank:military_strength" = "rank:military", "rank:techs_known" = "rank:techs", "rank:civics_known" = "rank:civics" }
instructions = """Everything must be achievable through orders: research and civic choices, policy cards, city production (units, buildings, projects; a district only once it is placed) and purchases with gold or faith. The game's AI moves units, places districts and wonders, founds cities with the settlers it has, and handles diplomacy, trade and World Congress.
Milestone dates are turns written T<turn>, e.g. T60 (the snapshot shows the current turn). Expansion benchmarks (strategy.md): 2 cities by T40, 3 by T60, 4 by T80.
While at war, the military stance names its exit condition (a city retaken, the enemy's strength below ours, or the war ending: something to watch, not a goal). No order can make peace, an alliance or a friendship, or denounce: the game's AI handles diplomacy during autoplay, so goals never name them.
Plan with the levers that stick: the order record shows which kinds of order held until done and which the AI replaced; where `production replace` does not stick, buy what must exist now and queue production only into empty queues."""

# The shared code's time constants, in turns here (docs/design/2026-09-27-postmortem-fixes-design.md,
# rulings 15 and 19): "12 in-game months" had silently become 12 turns.
[time]
unit = "turns"
review_cap = 5                  # event reviews: at most one per 5 turns (one default decision interval)...
review_exempt = ["new war", "city lost"]   # ...but these always review (and restart the 5 turns)
milestone_lookback = 12         # a milestone's projection: its value against a row 12 turns older
score_horizon = 12              # outcome scoring: the metrics 12 turns after a decision
buildup_window = 20             # neighbour buildup: +50% within 20 turns at 2 x ours (ruling 11)

# Falling behind the majors we have met (docs/design/2026-09-27-postmortem-fixes-design.md, ruling 10):
# ours under factor x their median, military also while last with 3+ met. Replayed on the Kublai rows
# (E4) this enters "behind" 10 times for military, 9 for techs, 0 for civics, 2 for score and cities;
# Stellaris's 0.5 never fires for techs, the gap the post-mortem names.
[peers]
behind = { military = 0.6, techs = 0.85, civics = 0.85, score = 0.8, cities = 0.8 }
last_min_peers = 3

[weights]
mode = "share"          # each pillar's share of effort (weight x milestone need)
min = 5
max = 40
spread = 2              # heaviest >= 2 x lightest
switch_margin = 1.0     # unused in share mode
need = { met = 0.3, on_track = 1.0, at_risk = 1.5, missed = 2.0 }
stall_years = 0         # no directives to judge

# The order record (docs/design/2026-09-27-civ6-levers-design.md, rulings 12 and 14): every order is
# followed until it completes, holds through its window, or the AI replaces it; the stick rate of a
# kind = (completed + held) / (completed + held + replaced by the AI).
[orders]
window_turns = 30       # orders resolved in the last 30 turns (about 8 production orders in the Kublai campaign)...
min_resolved = 8        # ...widened back until 8 are judged, or to the campaign start
min_samples = { production = 4, purchase = 4, other = 3 }   # below this: counts only, no rate
weak_rate = 0.5         # at or below: "does not stick here"
open_cap_turns = 20     # an order is followed min(20, max(3, turns left + 3)) turns; policies 20
open_grace_turns = 3

# Known-false learned rules (docs/design/2026-09-27-postmortem-fixes-design.md, ruling 29): a rule that matches
# one of these patterns (case-insensitive) is refused, and the model gets the reason. The patterns are the
# phrases of the false rules the Kublai campaign learned (T546-T565).
[learned]
refuse = [
  { pattern = "double the unit cost", why = "a defender may spend down to the reserve in a city in danger and, under military weakness, in any city (postmortem-fixes ruling 2); saving to twice the price left the defenders the game allowed at T496, T538 and T553 unbought" },
  { pattern = "save .{0,60}until the balance is double", why = "a defender may spend down to the reserve in a city in danger and, under military weakness, in any city (postmortem-fixes ruling 2); saving to twice the price left the defenders the game allowed at T496, T538 and T553 unbought" },
  { pattern = "cannot buy land units with faith", why = "false: faith bought land units at T35, T384 and T544, at about half the gold price (read both prices with `price`)" },
  { pattern = "in danger.{0,60}('not allowed|purchases (there )?are not allowed)|'not allowed.{0,60}in danger", why = "false: 'not allowed' in the defender list was the refusal of units needing a strategic resource we lacked (Oil); a Modern AT or Machine Gun could be bought in those cities. Read each refusal's reason in the briefing (needs 1 Oil, a unit is on the tile)" },
  { pattern = "not allowed in endangered cities", why = "false: 'not allowed' in the defender list was the refusal of units needing a strategic resource we lacked (Oil); a Modern AT or Machine Gun could be bought in those cities. Read each refusal's reason in the briefing (needs 1 Oil, a unit is on the tile)" },
]

[metrics]
# the snapshot's measures (src/pilot/civ6.py metrics); rank:<measure> is our standing among the
# majors we have met, 1 = best
names = ["science", "culture", "faith_yield", "gold_yield", "production", "food", "gold", "faith",
         "cities", "pop", "techs_known", "civics_known", "military", "score", "era_score",
         "rank:score", "rank:military", "rank:techs", "rank:civics", "rank:cities",
         "military_vs_median", "military_vs_strongest"]   # ours / the met majors' median; / the strongest non-ally
# Balances are measured but never milestones: a milestone on stored gold or faith paid the Strategist
# for hoarding (faith 38 -> 402 unspent, T41-T85); milestones use faith_yield and gold_yield.
milestone_exclude = ["gold", "faith"]

[pillars.science]
label = "Science"
description = "Science per turn, Campuses and which techs to research."
actions = ["tech"]

[pillars.culture]
label = "Culture"
description = "Culture per turn, civics, policy cards and governments."
actions = ["civic", "policy"]

[pillars.faith]
label = "Faith"
description = "Faith, a pantheon and religion, and what faith buys."
actions = ["purchase"]

[pillars.economy]
label = "Economy"
description = "Gold, production, trade and buying at the right time."
actions = ["production", "purchase"]

[pillars.military]
label = "Military"
description = "Defence of every city, army strength against the neighbours, wars."
actions = ["production", "purchase"]

[pillars.expansion]
label = "Expansion"
description = "Settlers, new cities, population and builders."
actions = ["production"]

[pillars.diplomacy]
label = "Diplomacy"
description = "Delegations, friendships, alliances, city-states and favor."

# Corpus ids (full, e.g. tech:pottery) the Strategist may prefer; a decision gives at most
# `max_orders` orders of each kind (the controller checks every id against data/ again).
[actions.tech]
max_items = 4
max_orders = 1
ids_from_corpus = "tech"
full_ids = true

[actions.civic]
max_items = 4
max_orders = 1
ids_from_corpus = "civic"
full_ids = true

[actions.policy]
max_items = 6
max_orders = 1          # one policies order (the whole set to slot)
ids_from_corpus = "policy"
full_ids = true
note = "Policy cards can be changed for free only in the turn a civic completes; otherwise the game asks for gold and the order is refused."

[actions.production]
max_items = 6
max_orders = 4          # one per city, up to 4 cities per decision
ids_from_corpus = ["unit", "building", "district", "project"]
full_ids = true
note = "Production takes units, buildings and projects; a district only once placed, never a wonder (placement is not supported yet)."

[actions.purchase]
max_items = 4
max_orders = 2
ids_from_corpus = ["unit", "building"]
full_ids = true
# Buy-out rules: docs/design/2026-09-27-civ6-levers-design.md, rulings 17-20.
gold_reserve = 30               # gold kept back, plus...
gold_reserve_per_deficit = 10   # ...10 per gold per turn of deficit (46 at -1.6 per turn)
faith_reserve = 0
pantheon_reserve = true         # until a pantheon is founded, faith keeps its live price (25 here)
prophet_faith_reserve = 0       # off until the Great Prophet's faith price is read live
treasury_share = 0.5    # one purchase takes at most half the balance...
threatened_share = 1.0  # ...but a defender in a city in danger, or in any city under military weakness, may spend down to the reserve (postmortem-fixes ruling 2)
skip_turns_left = 2     # never buy what the city finishes within 2 turns anyway
defence_first = true    # a city in danger with no defender on its tile: its defender before anything else
defender_classes = ["Melee", "Ranged", "Anti Cavalry", "Light Cavalry", "Heavy Cavalry"]
defence_cooldown_turns = 5      # at most one defender purchase per city per 5 turns
# The weakness test (docs/design/2026-09-27-postmortem-fixes-design.md, ruling 1): at war with a major,
# military last of the met majors (2+ met), under 0.6 x their median, or a met non-ally at 2 x ours.
weak_median_share = 0.6
strong_neighbour_ratio = 2.0
# Ruling 3: while that test holds, before each autoplay stretch of 2+ turns the governor buys one defender
# itself (the first ungarrisoned city; resource-free, of a defender class, within the cap and upkeep) and
# fills empty queues of ungarrisoned cities with one. false turns it off.
rule_buy = true
note = "Buy only what saves several turns; never what the city finishes within 2 turns anyway. Prices are read live, in gold and in faith: faith buys defenders at about half the gold price. Walls, castles and star forts cannot be bought: they come from production."
