name: Build and Push Appliance Image

on:
  push:
    branches: [main]
    # Docs and journals never change the image; skip the build so :latest only moves when the code does.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "games/**"
  workflow_dispatch:

# One build at a time, so two quick pushes cannot race on :latest or a version tag.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jad0083/game-pilot

jobs:
  # The image workflow's preflight is a subset of scripts/ci.sh: that script also needs mingw (Windows
  # agent cross-check) and a LuaJIT cache, which this job does not install.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Controller tests
        run: cargo test -p game-controller

      # Some Python tests run the real controller and skip without it.
      - name: Build the controller for the Python tests
        run: cargo build --release -p game-controller

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Python tests (no browser tests)
        run: .venv/bin/pytest -q -m "not ui"

      - name: Read package version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build --load -t game-pilot:ci \
            --label org.opencontainers.image.source=https://github.com/jad0083/game-harness \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .

      - name: Smoke test
        run: scripts/image-smoke.sh game-pilot:ci

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that passed the smoke test, not a rebuild. A version tag never moves: once
      # :<version> exists, a rebuild gets only :sha-<short> and :latest.
      - name: Tag and push
        run: |
          short="${GITHUB_SHA::7}"
          tags=("sha-${short}" latest)
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::${VERSION} already published; not moving that tag"
          else
            tags+=("${VERSION}")
          fi
          for t in "${tags[@]}"; do
            docker tag game-pilot:ci "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${short}" --format '{{json .Manifest.Digest}}')
          {
            echo "### Pushed ${IMAGE}"
            echo "- tags: ${tags[*]}"
            echo "- digest: ${digest}"
          } >> "$GITHUB_STEP_SUMMARY"
