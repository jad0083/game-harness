[project]
name = "game-harness"
version = "0.1.0"
description = "Let an AI agent play turn-based Windows games (Galactic Civilizations IV) over the LAN"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
game-harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude"]  # agent worktrees live under .claude/worktrees
